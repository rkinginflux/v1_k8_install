---
# ClusterRole: aggregate stats viewer rules
# Resolved from templates/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: influx-stats-viewer
  labels:
    helm.sh/chart: telegraf-ds-1.1.50
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: telegraf-ds
    app.kubernetes.io/instance: telegraf-ds
    rbac.authorization.k8s.io/aggregate-view-telegraf-stats: "true"
rules:
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/stats", "persistentvolumes"]
  verbs: ["get", "list", "watch"]
---
# ClusterRole: aggregates view + telegraf stats via labels
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: influx:telegraf
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      rbac.authorization.k8s.io/aggregate-view-telegraf-stats: "true"
  - matchLabels:
      rbac.authorization.k8s.io/aggregate-to-view: "true"
rules: []  # filled by controller manager via aggregation
---
# ClusterRoleBinding: bind the aggregated role to telegraf ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: influx-telegraf-viewer
  labels:
    helm.sh/chart: telegraf-ds-1.1.50
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: telegraf-ds
    app.kubernetes.io/instance: telegraf-ds
subjects:
- kind: ServiceAccount
  name: telegraf-ds
  namespace: telegraf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: influx:telegraf
---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: telegraf
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegraf-ds
  namespace: telegraf
  labels:
    helm.sh/chart: telegraf-ds-1.1.50
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: telegraf-ds
    app.kubernetes.io/instance: telegraf-ds
---
# ConfigMap: telegraf.conf
# Generated from templates/configmap.yaml + default values.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-ds
  namespace: telegraf
  labels:
    helm.sh/chart: telegraf-ds-1.1.50
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: telegraf-ds
    app.kubernetes.io/instance: telegraf-ds
data:
  telegraf.conf: |
    [agent]
      interval = "10s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      debug = false
      quiet = false
      logfile = ""
      hostname = "$HOSTNAME"
      omit_hostname = false

    [[inputs.diskio]]
    [[inputs.kernel]]
    [[inputs.mem]]
    [[inputs.net]]
    [[inputs.processes]]
    [[inputs.system]]
    [[inputs.syslog]]
       server = "tcp://:6514"
    [[inputs.cpu]]
      percpu = true
      totalcpu = true
      collect_cpu_time = false
      report_active = false
    [[inputs.disk]]
      ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
    [[inputs.kubernetes]]
      url = "https://$HOSTIP:10250"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true
    [[inputs.influxdb]]
      interval = "10s"
      timeout = "5s"
      urls = ["http://influxdb-enterprise-data.influxdb-enterprise.svc.cluster.local:8086/debug/vars"]
      username = "admin"
      password = "changeme"
      insecure_skip_verify = true
    [[inputs.prometheus]]
      interval = "10s"
      timeout = "5s"
      urls = ["http://influxdb-enterprise-data.influxdb-enterprise.svc.cluster.local:8086/metrics"]
      username = "admin"
      password = "changeme"
      insecure_skip_verify = true
    [[outputs.influxdb]]
      urls = ["http://influxdb-enterprise-data.influxdb-enterprise.svc.cluster.local:8086"]
      database = "telegraf"
      retention_policy = ""
      timeout = "5s"
      username = "admin"
      password = "changeme"
      user_agent = "telegraf"
      insecure_skip_verify = true
---
# DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: telegraf-ds
  namespace: telegraf
  labels:
    helm.sh/chart: telegraf-ds-1.1.50
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: telegraf-ds
    app.kubernetes.io/instance: telegraf-ds
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: telegraf-ds
      app.kubernetes.io/instance: telegraf-ds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegraf-ds
        app.kubernetes.io/instance: telegraf-ds
      annotations:
        checksum/config: PLACEHOLDER
    spec:
      serviceAccountName: telegraf-ds
      containers:
      - name: telegraf-ds
        image: "telegraf:1.3-alpine"
        imagePullPolicy: "IfNotPresent"
        ports:
        - name: syslog-tcp
          containerPort: 6514
          hostPort: 6514
          protocol: TCP
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 2Gi
            cpu: 1
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOSTIP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: HOST_PROC
          value: "/hostfs/proc"
        - name: HOST_SYS
          value: "/hostfs/sys"
        - name: HOST_MOUNT_PREFIX
          value: "/hostfs"
        volumeMounts:
        - name: varrunutmpro
          mountPath: /var/run/utmp
          readOnly: true
        - name: hostfsro
          mountPath: /hostfs
          readOnly: true
        - name: config
          mountPath: /etc/telegraf
      volumes:
      - name: hostfsro
        hostPath:
          path: /
      - name: varrunutmpro
        hostPath:
          path: /var/run/utmp
      - name: config
        configMap:
          name: telegraf-ds
