# =============================================================================
# InfluxDB Enterprise v1.x — Consolidated Kubernetes Manifest
# =============================================================================
# Generated from: https://github.com/influxdata/helm-charts/tree/master/charts/influxdb-enterprise
# Configuration:
#   - 3 Meta Nodes, 2 Data Nodes
#   - Security defaults OFF (HTTP only, TLS/auth disabled)
#   - Persistence: local-path storage, 8Gi per PVC
#   - Flux enabled on data nodes
#   - Auth bootstrap: admin / changeme (without TLS flags)
#   - Index: TSI (tsi1) for high-cardinality workloads
#   - License: license-path (air-gapped ready; see README)
#
# Prerequisites:
#   1. local-path-provisioner installed (default StorageClass)
#   2. License JSON in influxdb-license Secret (see README)
#   3. kubectl apply -f influxdb-enterprise-v1-deploy.yaml
# =============================================================================

---
# =============================================================================
# Namespace
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise

---
# =============================================================================
# Secrets
# =============================================================================

# Shared internal secret for meta/data node communication
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-shared-secret
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    app.kubernetes.io/version: "1.12.3"
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  secret: OTc5MTcxZjUzNjg2ODFlM2Q2MjdhNTVkNmZmZGEwOTQ5OTJjNTY1NzI3MzI4MzY5NGQ4Njc3NGY5ODI3MmEzOQ==

---
# Admin credentials for bootstrap
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-auth
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
type: Opaque
data:
  username: YWRtaW4=
  password: Y2hhbmdlbWU=

---
# License JSON for air-gapped clusters.
# Create this Secret BEFORE applying the manifest:
#   export LICENSE_JSON='{"signature":"...","license":{...}}'
#   kubectl -n influxdb-enterprise create secret generic influxdb-license \
#     --from-literal=license.json="${LICENSE_JSON}" --dry-run=client -o yaml | kubectl apply -f -
# If using a connected cluster, skip this and switch ConfigMaps back to license-key.
# The StatefulSets already include the volume mount — just provide the Secret.
---
# =============================================================================
# cert-manager: Self-Signed Issuer
# =============================================================================
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: influxdb-enterprise
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
spec:
  selfSigned: {}

---
# =============================================================================
# cert-manager: Meta Certificate (CA, covers all 3 meta pods)
# =============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: influxdb-enterprise-meta
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
spec:
  dnsNames:
  - influxdb-enterprise-meta
  - influxdb-enterprise-meta.influxdb-enterprise.svc
  - influxdb-enterprise-meta-0.influxdb-enterprise-meta
  - influxdb-enterprise-meta-0.influxdb-enterprise-meta.influxdb-enterprise
  - influxdb-enterprise-meta-0.influxdb-enterprise-meta.influxdb-enterprise.svc
  - influxdb-enterprise-meta-1.influxdb-enterprise-meta
  - influxdb-enterprise-meta-1.influxdb-enterprise-meta.influxdb-enterprise
  - influxdb-enterprise-meta-1.influxdb-enterprise-meta.influxdb-enterprise.svc
  - influxdb-enterprise-meta-2.influxdb-enterprise-meta
  - influxdb-enterprise-meta-2.influxdb-enterprise-meta.influxdb-enterprise
  - influxdb-enterprise-meta-2.influxdb-enterprise-meta.influxdb-enterprise.svc
  isCA: true
  issuerRef:
    kind: Issuer
    name: influxdb-enterprise
  secretName: influxdb-enterprise-meta-tls

---
# =============================================================================
# cert-manager: Data Certificate (CA, covers both data pods)
# =============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: influxdb-enterprise-data
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
spec:
  dnsNames:
  - influxdb-enterprise-data
  - influxdb-enterprise-data.influxdb-enterprise.svc
  - influxdb-enterprise-data-0.influxdb-enterprise-data
  - influxdb-enterprise-data-0.influxdb-enterprise-data.influxdb-enterprise
  - influxdb-enterprise-data-0.influxdb-enterprise-data.influxdb-enterprise.svc
  - influxdb-enterprise-data-1.influxdb-enterprise-data
  - influxdb-enterprise-data-1.influxdb-enterprise-data.influxdb-enterprise
  - influxdb-enterprise-data-1.influxdb-enterprise-data.influxdb-enterprise.svc
  isCA: true
  issuerRef:
    kind: Issuer
    name: influxdb-enterprise
  secretName: influxdb-enterprise-data-tls

---
# =============================================================================
# ConfigMap: Meta Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: influxdb-enterprise-meta
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    app.kubernetes.io/version: "1.12.3"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: meta
data:
  influxdb-meta.conf: |+
    bind-address = ":8091"
    reporting-disabled = false
    [enterprise]
      # license-key and license-path are mutually exclusive, use only one and leave the other blank
      # license-key = "684a9932-126d-4814-bc7c-400fdbe5b099"
      license-path = "/var/lib/influxdb/license.json"
    [meta]
      dir = "/var/lib/influxdb/meta"
      auth-enabled = false
      meta-auth-enabled = false
      https-enabled = false
      https-certificate = "/var/run/secrets/tls/tls.crt"
      https-private-key = "/var/run/secrets/tls/tls.key"
      https-insecure-tls = false
      data-use-tls = false
      data-insecure-tls = false

  entrypoint.pl: |+
    #!/usr/bin/env perl
    $ENV{INFLUXDB_HOSTNAME} = `hostname -f`;
    $ENV{INFLUXDB_HOSTNAME} =~ s/\n$//;

    $pid = fork();

    # Inside this conditional is our child process, which
    # will return `influxd-meta`
    if($pid == 0) {
      exec('influxd-meta') or die("Failed to execute influxd-meta: $!\n");
    }

    $SIG{HUP} = sub { kill 'HUP', $pid };
    $SIG{TERM} = sub { kill 'TERM', $pid };
    $SIG{KILL} = sub { kill 'KILL', $pid };

    # Register meta node
    my $meta_leader = $ENV{INFLUXDB_HOSTNAME};
    $meta_leader =~ s/-[0-9]+./-0./;

    # We're not going to define an exit strategy for failure here.
    # This should be handled by the probes on the pods
    while (true) {
      if($meta_leader eq $ENV{INFLUXDB_HOSTNAME}) {
        system('influxd-ctl', 'add-meta', "$ENV{INFLUXDB_HOSTNAME}:8091");
      } else {
        system('influxd-ctl', 'join', "$meta_leader:8091");
      }

      if ($? == 0) {
          last;
      }

      # Wait a few seconds and try again
      sleep(2);
    }

    waitpid($pid, 0);
    exit $?

---
# =============================================================================
# ConfigMap: Data Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: influxdb-enterprise-data
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    app.kubernetes.io/version: "1.12.3"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: data
data:
  influxdb.conf: |+
    bind-address = ":8088"
    reporting-disabled = false

    [http]
    auth-enabled = false
    https-enabled = false
    https-certificate = "/var/run/secrets/tls/tls.crt"
    https-private-key = "/var/run/secrets/tls/tls.key"
    flux-enabled = true

    [enterprise]
      # license-key and license-path are mutually exclusive, use only one and leave the other blank
      # license-key = "684a9932-126d-4814-bc7c-400fdbe5b099"
      license-path = "/var/lib/influxdb/license.json"

    [cluster]
    https-enabled = false
    https-certificate = "/var/run/secrets/tls/tls.crt"
    https-private-key = "/var/run/secrets/tls/tls.key"
    https-insecure-tls = false

    [meta]
      dir = "/var/lib/influxdb/meta"
      meta-tls-enabled = false
      meta-insecure-tls = false

    [hinted-handoff]
      dir = "/var/lib/influxdb/hh"

    [data]
      dir = "/var/lib/influxdb/data"
      wal-dir = "/var/lib/influxdb/wal"
      index-version = "tsi1"

  entrypoint.pl: |+
    #!/usr/bin/env perl
    $ENV{INFLUXDB_HOSTNAME} = `hostname -f`;
    $ENV{INFLUXDB_HOSTNAME} =~ s/\n$//;

    $pid = fork();

    # Inside this conditional is our child process, which
    # will return `influxd`
    if($pid == 0) {
      exec('influxd') or die("Failed to execute influxd: $!\n");
    }

    $SIG{HUP} = sub { kill 'HUP', $pid };
    $SIG{TERM} = sub { kill 'TERM', $pid };
    $SIG{KILL} = sub { kill 'KILL', $pid };

    # Register data node with meta leader
    my $protocol = "http";
    my $meta_service = $ENV{RELEASE_NAME} . "-meta";

    # We're not going to define an exit strategy for failure here.
    # This should be handled by the probes on the pods
    while (true) {
      # There's no LWP/Simple available in our images, so forking out to curl 😥
      print "\n\n\nREGISTER WITH META SERVICE\n\n\n";
      $exit_code = system('curl', '-XPOST', '--silent', '--fail', '--retry', '5', '--retry-delay', '0', "-Faddr=$ENV{INFLUXDB_HOSTNAME}:8088", "$protocol://$meta_service:8091/add-data");

      if ($exit_code == 0) {
        $| = 1;
        last;
      }
      print "\n\n\nFailed: $!\n\n\n";
      $| = 1;

      exit 255
    }

    waitpid($pid, 0);
    exit $?

---
# =============================================================================
# Service: Meta (Headless — for StatefulSet DNS)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: influxdb-enterprise-meta
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    influxdb.influxdata.com/component: meta
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 8089
    protocol: TCP
    name: raft
  - port: 8091
    protocol: TCP
    name: http
  selector:
    influxdb.influxdata.com/component: meta
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise

---
# =============================================================================
# Service: Data (Headless — for StatefulSet DNS)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: influxdb-enterprise-data
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    influxdb.influxdata.com/component: data
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 8086
    protocol: TCP
    name: http
  - port: 8088
    protocol: TCP
    name: rpc
  - port: 2003
    protocol: TCP
    name: graphite
  - port: 4242
    protocol: TCP
    name: opentsdb
  - port: 25826
    protocol: UDP
    name: collectd
  - port: 8089
    protocol: UDP
    name: udp
  selector:
    influxdb.influxdata.com/component: data
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise

---
# =============================================================================
# StatefulSet: Meta Nodes (3 replicas)
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb-enterprise-meta
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    app.kubernetes.io/version: "1.12.3"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  podManagementPolicy: Parallel
  serviceName: influxdb-enterprise-meta
  selector:
    matchLabels:
      influxdb.influxdata.com/component: meta
      app.kubernetes.io/name: influxdb-enterprise
      app.kubernetes.io/instance: influxdb-enterprise
  template:
    metadata:
      labels:
        influxdb.influxdata.com/component: meta
        app.kubernetes.io/name: influxdb-enterprise
        app.kubernetes.io/instance: influxdb-enterprise
    spec:
      serviceAccountName: default
      volumes:
      - name: config
        configMap:
          name: influxdb-enterprise-meta
      - name: tls
        secret:
          defaultMode: 0600
          secretName: influxdb-enterprise-meta-tls
      - name: license
        secret:
          secretName: influxdb-license
          items:
          - key: license.json
            path: license.json
      containers:
        - name: influxdb-enterprise
          image: influxdb:1.12.4-meta
          imagePullPolicy: IfNotPresent
          command:
          - "/usr/bin/perl"
          args:
          - "/etc/influxdb/entrypoint.pl"
          env:
            - name: INFLUXDB_META_INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: influxdb-shared-secret
                  key: secret
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
            - name: raft
              containerPort: 8089
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 3600
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
          volumeMounts:
          - name: config
            mountPath: /etc/influxdb
          - name: influxdb-enterprise-meta-data
            mountPath: /var/lib/influxdb
          - name: tls
            mountPath: /var/run/secrets/tls/
          - name: license
            mountPath: /var/lib/influxdb/license.json
            subPath: license.json
  volumeClaimTemplates:
    - metadata:
        name: influxdb-enterprise-meta-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
        storageClassName: local-path

---
# =============================================================================
# StatefulSet: Data Nodes (2 replicas)
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb-enterprise-data
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
    app.kubernetes.io/version: "1.12.3"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  podManagementPolicy: Parallel
  serviceName: influxdb-enterprise-data
  selector:
    matchLabels:
      influxdb.influxdata.com/component: data
      app.kubernetes.io/name: influxdb-enterprise
      app.kubernetes.io/instance: influxdb-enterprise
  template:
    metadata:
      labels:
        influxdb.influxdata.com/component: data
        app.kubernetes.io/name: influxdb-enterprise
        app.kubernetes.io/instance: influxdb-enterprise
    spec:
      serviceAccountName: default
      volumes:
      - name: config
        configMap:
          name: influxdb-enterprise-data
      - name: tls
        secret:
          defaultMode: 0600
          secretName: influxdb-enterprise-data-tls
      - name: license
        secret:
          secretName: influxdb-license
          items:
          - key: license.json
            path: license.json
      containers:
        - name: influxdb-enterprise
          image: influxdb:1.12.4-data
          imagePullPolicy: IfNotPresent
          command:
          - "/usr/bin/perl"
          args:
          - "/etc/influxdb/entrypoint.pl"
          env:
          - name: RELEASE_NAME
            value: influxdb-enterprise
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
            - name: raft
              containerPort: 8088
              protocol: TCP
            - name: udp
              containerPort: 8089
              protocol: UDP
            - name: graphite
              containerPort: 2003
              protocol: TCP
            - name: opentsdb
              containerPort: 4242
              protocol: TCP
            - name: collectd
              containerPort: 25826
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
            initialDelaySeconds: 3600
          readinessProbe:
            initialDelaySeconds: 30
            httpGet:
              path: /ping
              port: http
              scheme: HTTP
          volumeMounts:
          - name: config
            mountPath: /etc/influxdb
          - name: influxdb-enterprise-data-data
            mountPath: /var/lib/influxdb
          - name: tls
            mountPath: /var/run/secrets/tls/
          - name: license
            mountPath: /var/lib/influxdb/license.json
            subPath: license.json
  volumeClaimTemplates:
    - metadata:
        name: influxdb-enterprise-data-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
        storageClassName: local-path

---
# =============================================================================
# Job: Bootstrap — Create admin user with ALL PRIVILEGES
# =============================================================================
# ⚠ This Job is best-effort. It depends on all data pods being Ready before it
# can connect. If the cluster comes up clean, this works. If anything delays
# the pods (missing Secrets, image pull issues), the Job will fail and the
# admin user won't be created.
#
# After deploying, verify the admin user exists:
#   kubectl -n influxdb-enterprise exec influxdb-enterprise-data-0 -- \
#     influx -execute 'SHOW USERS'
#
# If missing, create manually:
#   kubectl -n influxdb-enterprise exec influxdb-enterprise-data-0 -- \
#     influx -execute \
#     'CREATE USER admin WITH PASSWORD '\''changeme'\'' WITH ALL PRIVILEGES'
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: influxdb-enterprise-bootstrap
  namespace: influxdb-enterprise
  labels:
    app.kubernetes.io/name: influxdb-enterprise
    app.kubernetes.io/instance: influxdb-enterprise
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb-enterprise
        app.kubernetes.io/instance: influxdb-enterprise
    spec:
      restartPolicy: OnFailure
      serviceAccountName: default
      initContainers:
      - name: auth
        image: influxdb:1.12.3-data
        imagePullPolicy: IfNotPresent
        env:
        - name: INFLUX_USERNAME
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: "username"
        - name: INFLUX_PASSWORD
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: "password"
        command:
          - sh
          - -ec
        args:
          - |
            out="$(influx -host influxdb-enterprise-data \
              -execute "CREATE USER $INFLUX_USERNAME WITH PASSWORD '$INFLUX_PASSWORD' WITH ALL PRIVILEGES" 2>&1)" || rc=$?
            if [ "${rc:-0}" -ne 0 ]; then
              echo "$out"
              echo "$out" | grep -qi "already exists" && exit 0
              exit "${rc}"
            fi
            echo "$out"
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 50Mi
      containers:
      - name: success
        image: influxdb:1.12.3-data
        imagePullPolicy: IfNotPresent
        command:
          - echo
        args:
          - "Bootstrap Success"
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 50Mi
